# Perfil de desenvolvimento: PostgreSQL local.
# Os dados são mantidos entre reinícios (ddl-auto: update cria/atualiza as tabelas).
# Pré-requisito: PostgreSQL rodando e o banco criado (CREATE DATABASE comodeu;).
# Variáveis de ambiente opcionais:
#   DB_URL       (padrão: jdbc:postgresql://localhost:5432/comodeu)
#   DB_USERNAME  (padrão: postgres)
#   DB_PASSWORD  (padrão: postgres)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/comodeu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  # CORS: Flutter Web em qualquer porta local (flutter run -d chrome usa porta aleatória)
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*

  # Usuário ADMIN criado automaticamente a cada start (DevUserSeeder)
  # Login: POST /api/auth/login  {"email": "admin@comodeu.dev", "password": "admin123"}
  dev-user:
    name: Administrador
    email: admin@comodeu.dev
    password: admin123

jwt:
  # Mínimo de 32 bytes (HS256)
  secret: heN5tq0GN0T0BEPdNd1q1IYbQANRmqPRCcxxzj2sLFMJEChOw4JHm8pYs61o1NKg

logging:
  level:
    root: INFO
    com.comodeu: DEBUG
