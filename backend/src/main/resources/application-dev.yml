# Perfil de desenvolvimento: H2 em memória (não precisa de PostgreSQL).
# Os dados são perdidos ao parar a aplicação.
# Console: http://localhost:8080/api/h2-console  (JDBC URL: jdbc:h2:mem:como_deu, usuário: sa, senha vazia)
spring:
  datasource:
    url: jdbc:h2:mem:como_deu;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  # CORS: Flutter Web em qualquer porta local (flutter run -d chrome usa porta aleatória)
  cors:
    allowed-origins: http://localhost:*,http://127.0.0.1:*

  # Usuário ADMIN criado automaticamente a cada start (DevUserSeeder)
  # Login: POST /api/auth/login  {"email": "admin@comodeu.dev", "password": "admin123"}
  dev-user:
    name: Administrador
    email: admin@comodeu.dev
    password: admin123

jwt:
  # Mínimo de 32 bytes (HS256)
  secret: heN5tq0GN0T0BEPdNd1q1IYbQANRmqPRCcxxzj2sLFMJEChOw4JHm8pYs61o1NKg

logging:
  level:
    root: INFO
    com.comodeu: DEBUG
