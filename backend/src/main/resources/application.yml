# Configuração comum a todos os perfis.
# Perfis:
#   dev  (padrão) -> application-dev.yml  : H2 em memória
#   prod          -> application-prod.yml : PostgreSQL
# Para usar prod: SPRING_PROFILES_ACTIVE=prod  ou  --spring.profiles.active=prod
spring:
  application:
    name: como-deu-api

  profiles:
    default: dev  # usado só quando nenhum perfil é informado

  jpa:
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

jwt:
  expiration: 86400000  # 24 horas em ms
