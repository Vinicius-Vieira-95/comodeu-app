spring:
  application:
    name: como-deu-api

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://localhost:5432/como_deu
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: sua-chave-secreta-muito-segura-aqui-change-in-production
  expiration: 86400000  # 24 horas em ms

logging:
  level:
    root: INFO
    com.comodeu: DEBUG
