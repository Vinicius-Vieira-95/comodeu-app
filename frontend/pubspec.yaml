name: como_deu_app
description: Aplicação COMO D'EU para avaliação de espaços culturais
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.1.0

  # State management
  provider: ^6.0.0

  # Local storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.0

  # Image handling
  image_picker: ^1.0.0
  image: ^4.0.0

  # UI
  flutter_svg: ^2.0.0
  google_fonts: ^6.0.0

  # Utilities
  intl: ^0.18.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
